# GitOps for the project: every commit to main is built and released to staging by committing
# the new image tags to project/overlays/staging (ArgoCD app argocd/project-staging.yaml).
name: Release project to staging

on:
  push:
    branches: [main]
    paths:
      - 'todo_app/**'
      - 'todo_backend/**'
      - 'todo_cronjob/**'
      - 'todo_backup/**'
      - 'broadcaster/**'
      - '.github/workflows/project.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: imranismail/setup-kustomize@v2

      - name: Build, publish and set images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for APP in todo_app todo_backend todo_cronjob todo_backup broadcaster; do
            NAME=$(echo $APP | tr '_' '-')
            IMAGE=ghcr.io/$OWNER/$NAME:$GITHUB_SHA
            docker build --tag $IMAGE $APP
            docker push $IMAGE
            PLACEHOLDER=PROJECT/$(echo $APP | tr '[:lower:]' '[:upper:]')
            (cd project/overlays/staging && kustomize edit set image $PLACEHOLDER=$IMAGE)
          done

      - uses: EndBug/add-and-commit@v9
        with:
          add: project/overlays/staging/kustomization.yaml
          message: Release to staging ${{ github.sha }}
