# GitOps for the project: builds the images and commits the new tags to project/kustomization.yaml.
# ArgoCD (argocd/project.yaml) notices the commit and deploys main to the cluster.
name: Release project

on:
  push:
    branches: [main]
    paths:
      - 'todo_app/**'
      - 'todo_backend/**'
      - 'todo_cronjob/**'
      - 'todo_backup/**'
      - 'broadcaster/**'
      - '.github/workflows/project.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: imranismail/setup-kustomize@v2

      - name: Build, publish and set images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for APP in todo_app todo_backend todo_cronjob todo_backup broadcaster; do
            NAME=$(echo $APP | tr '_' '-')
            IMAGE=ghcr.io/$OWNER/$NAME:$GITHUB_SHA
            docker build --tag $IMAGE $APP
            docker push $IMAGE
            PLACEHOLDER=PROJECT/$(echo $APP | tr '[:lower:]' '[:upper:]')
            (cd project && kustomize edit set image $PLACEHOLDER=$IMAGE)
          done

      - uses: EndBug/add-and-commit@v9
        with:
          add: project/kustomization.yaml
          message: New project version ${{ github.sha }}
