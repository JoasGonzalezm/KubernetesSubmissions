# Every commit to main is built and released to staging: the new image tags are committed to
# overlays/staging in the configuration repository, where ArgoCD picks them up.
name: Release project to staging

on:
  push:
    branches: [main]
    paths:
      - 'todo_app/**'
      - 'todo_backend/**'
      - 'todo_cronjob/**'
      - 'todo_backup/**'
      - 'broadcaster/**'
      - '.github/workflows/project.yml'

permissions:
  contents: read
  packages: write

env:
  CONFIG_REPO: JoasGonzalezm/KubernetesSubmissions-config

jobs:
  build-publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}
          path: config

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: imranismail/setup-kustomize@v2

      - name: Build, publish and set images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for APP in todo_app todo_backend todo_cronjob broadcaster; do
            NAME=$(echo $APP | tr '_' '-')
            IMAGE=ghcr.io/$OWNER/$NAME:$GITHUB_SHA
            docker build --tag $IMAGE $APP
            docker push $IMAGE
            PLACEHOLDER=PROJECT/$(echo $APP | tr '[:lower:]' '[:upper:]')
            (cd config/overlays/staging && kustomize edit set image $PLACEHOLDER=$IMAGE)
          done

      - uses: EndBug/add-and-commit@v9
        with:
          cwd: config
          add: overlays/staging/kustomization.yaml
          message: Release ${{ github.sha }} to staging
          pull: '--rebase --autostash'
