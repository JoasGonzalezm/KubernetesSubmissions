# Every tagged commit is released to production. The images for the tag are built by the
# "Build images" workflow; after it succeeds the tag is committed to overlays/production in
# the configuration repository, where ArgoCD picks it up.
name: Release project to production

on:
  workflow_run:
    workflows: [Build images]
    types: [completed]

permissions:
  contents: read

env:
  CONFIG_REPO: JoasGonzalezm/KubernetesSubmissions-config

jobs:
  release-production:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          ssh-key: ${{ secrets.CONFIG_REPO_DEPLOY_KEY }}

      - uses: imranismail/setup-kustomize@v2

      - name: Use the images of the tag
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
        working-directory: overlays/production
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for APP in todo_app todo_backend todo_cronjob todo_backup broadcaster; do
            NAME=$(echo $APP | tr '_' '-')
            PLACEHOLDER=PROJECT/$(echo $APP | tr '[:lower:]' '[:upper:]')
            kustomize edit set image $PLACEHOLDER=ghcr.io/$OWNER/$NAME:$TAG
          done

      - uses: EndBug/add-and-commit@v9
        with:
          add: overlays/production/kustomization.yaml
          message: Release ${{ github.event.workflow_run.head_branch }} to production
          pull: '--rebase --autostash'
