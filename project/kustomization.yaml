apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: project
resources:
  - ../todo_app/manifests
  - ../todo_backend/manifests
  - ../todo_cronjob/manifests
  - ../todo_backup/manifests
images:
  - name: PROJECT/TODO_APP
    newName: ghcr.io/joasgonzalezm/todo-app
    newTag: "4.5"
  - name: PROJECT/TODO_BACKEND
    newName: ghcr.io/joasgonzalezm/todo-backend
    newTag: "4.5"
  - name: PROJECT/TODO_CRONJOB
    newName: ghcr.io/joasgonzalezm/todo-cronjob
    newTag: "4.5"
  - name: PROJECT/TODO_BACKUP
    newName: ghcr.io/joasgonzalezm/todo-backup
    newTag: "4.5"
