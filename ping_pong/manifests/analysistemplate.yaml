# Follows the CPU usage of all containers in the namespace for 5 minutes after half of the
# pods run the new version. If the sum goes over the limit the rollout is aborted and reverted.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  namespace: exercises
  name: cpu-usage
spec:
  metrics:
    - name: namespace-cpu-usage
      interval: 1m
      count: 5
      failureLimit: 0
      # CPU cores used by the whole namespace. Set this to e.g. 0.001 to see the update reverted.
      successCondition: result < 0.3
      provider:
        prometheus:
          address: http://prom-prometheus-server.monitoring.svc.cluster.local
          query: |
            scalar(sum(rate(container_cpu_usage_seconds_total{namespace="exercises", container!=""}[1m])))
