# Makes the serverless ping-pong reachable from the browser in /pingpong: the request is sent
# to Kourier with the Knative host name of the service. Replace <IP> with the address in
# `kubectl get ksvc -n exercises ping-pong`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: exercises
  name: ping-pong-route
spec:
  parentRefs:
    - name: exercises-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: ping-pong.exercises.<IP>.sslip.io
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: kourier
          namespace: kourier-system
          port: 80
---
# Allows routes in the exercises namespace to use the Kourier service
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  namespace: kourier-system
  name: allow-exercises-routes
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: exercises
  to:
    - group: ""
      kind: Service
      name: kourier
