apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: greeter-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v1
  template:
    metadata:
      labels:
        app: greeter
        version: v1
    spec:
      containers:
        - name: greeter
          image: ghcr.io/joasgonzalezm/greeter:5.3
          env:
            - name: GREETING
              value: Hello
            - name: VERSION
              value: v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: greeter-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v2
  template:
    metadata:
      labels:
        app: greeter
        version: v2
    spec:
      containers:
        - name: greeter
          image: ghcr.io/joasgonzalezm/greeter:5.3
          env:
            - name: GREETING
              value: Hola
            - name: VERSION
              value: v2
