# Handled by the Istio waypoint of the namespace: 75% of the requests to greeter-svc go to v1
# and 25% to v2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: exercises
  name: greeter-split
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: greeter-svc
      port: 80
  rules:
    - backendRefs:
        - name: greeter-svc-1
          port: 80
          weight: 75
        - name: greeter-svc-2
          port: 80
          weight: 25
